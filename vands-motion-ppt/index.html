<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>밴스의원 부산점 · GEO 제안</title>
  <link rel="stylesheet" href="deck.css" />
</head>
<body>
  <div id="stage">
    <section class="slide" data-n="1" aria-label="1부 진단"></section>
    <section class="slide" data-n="2" aria-label="2부 이번 제공 범위"></section>
    <section class="slide" data-n="3" aria-label="3부 향후 로드맵"></section>
    <div id="cap" aria-live="polite"></div>
    <div id="hud"></div>
    <div id="bar"></div>
  </div>
  <div id="start" role="button" tabindex="0" aria-label="발표 시작">
    <div><b>Dr.GEO × CoMindWorks</b><h1>밴스의원 부산점 · GEO 제안</h1>
      <p>클릭하거나 <kbd>Space</kbd>를 눌러 시작 · 단축키 <kbd>?</kbd></p></div>
  </div>
  <div id="help" role="dialog" aria-label="단축키">
    <kbd>→</kbd> 다음 장 · <kbd>←</kbd> 이전 장<br />
    <kbd>Space</kbd> 재생 / 일시정지 · <kbd>R</kbd> 처음부터<br />
    <kbd>.</kbd> <kbd>,</kbd> 장면 안에서 앞뒤로 건너뛰기<br />
    <kbd>M</kbd> 소리 끄기 · <kbd>C</kbd> 자막 · <kbd>F</kbd> 전체 화면<br />
    <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 장 바로 가기 · <kbd>?</kbd> 이 도움말
  </div>
  <audio id="bgm" src="assets/audio/bgm.m4a" loop preload="auto"></audio>
  <audio id="vo" preload="auto"></audio>
  <script src="vendor/gsap.min.js"></script>
  <script src="narration.js"></script>
  <script src="assets/audio/narration/timing.js" onerror="this.remove()"></script>
  <script src="slides.js"></script>
  <script src="deck.js"></script>
</body>
</html>
