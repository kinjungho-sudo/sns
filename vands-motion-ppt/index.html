<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>밴스의원 부산점 GEO 모션 발표</title><link id="theme-css" rel="stylesheet" href="style.css"><script src="theme.js"></script></head>
<body><div id="shell"><header><div class="brand">Dr.GEO <span>×</span> CoMindWorks</div><div class="client">밴스의원 부산점</div><div id="chapters" role="navigation" aria-label="부 선택"><button data-part="1">1부 · 진단</button><button data-part="2">2부 · 이번 제공 범위</button><button data-part="3">3부 · 향후 로드맵</button></div><label class="theme-pick">테마 <select id="theme-select" aria-label="테마 선택"></select></label><button id="fullscreen" aria-label="전체 화면 (F)">전체 화면</button></header><div class="workspace"><nav id="rail" aria-label="장면 선택"></nav><main><div class="heading"><div><span id="number"></span><h1 id="title"></h1></div><p id="subtitle"></p></div><div id="scene" aria-label="발표 장면"></div><div class="source"><span id="source"></span><a id="evidence" target="_blank" rel="noopener">원문 보기 ↗</a></div></main></div><footer><span id="status" aria-live="polite"></span><div class="controls"><button id="prev" aria-label="이전 단계 (왼쪽 화살표)">← 이전 단계</button><button id="play" aria-label="재생 (Space)">재생</button><button id="next" aria-label="다음 단계 (오른쪽 화살표)">다음 단계 →</button><button id="restart">장면 다시 보기</button></div><label>장면 진행 <input id="seek" type="range" min="0" max="8" step="0.01" value="0"></label><span id="clock"></span></footer><div id="progress"></div></div><p class="help">← → 단계 이동 · PageUp / PageDown 장면 이동 · Space 재생 / 일시정지 · Home / End · F 전체 화면</p><script src="next-scenes.js"></script><script src="roadmap-scenes.js"></script><script src="app.js"></script></body></html>
