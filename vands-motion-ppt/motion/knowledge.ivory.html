<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>knowledge · 시연 영상 소스</title>
  <!-- 3부 내부 지식 보조 시연 (10초). 가상 예시. 답의 내용은 고객 전달 시안 화면에 적힌 문구(평일 20시까지 · 토·일 진료)에서만 가져온다. -->
  <link rel="stylesheet" href="base.ivory.css" />
  <style>
    .chat { position: absolute; left: 110px; top: 170px; width: 900px; height: 740px; padding: 0; overflow: hidden; }
    .chat .top { height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 34px; border-bottom:1px solid #e9e0d2; font-size: 26px; font-weight: 800; }
    .chat .top i { width: 16px; height: 16px; border-radius: 50%; background: var(--ok); }
    .msgs { padding: 34px; display: flex; flex-direction: column; gap: 26px; }
    .q { align-self: flex-end; max-width: 640px; padding: 22px 28px; border-radius: 24px 24px 6px 24px; background:#bf9a62; font-size: 30px; line-height: 1.45; min-height: 90px; }
    .who { font-size: 20px; color: var(--muted); margin-bottom: -14px; }
    .a { align-self: flex-start; max-width: 760px; padding: 24px 30px; border-radius: 24px 24px 24px 6px; background: var(--paper); color: var(--paper-ink); font-size: 30px; line-height: 1.5; min-height: 100px; }
    .dots { display: flex; gap: 10px; padding: 26px 30px; border-radius: 24px; background:#f0eae2; align-self: flex-start; }
    .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
    .cite { align-self: flex-start; }
    .doc { position: absolute; left: 1080px; top: 230px; width: 740px; padding: 40px; }
    .doc h3 { font-size: 30px; font-weight: 800; }
    .doc .sub { margin-top: 6px; font-size: 20px; color:#725529; }
    .doc .l { margin-top: 20px; height: 22px; border-radius: 6px; background:#e2dfda; }
    .doc .hl { position: relative; margin-top: 22px; padding: 18px 22px; border-radius: 10px; font-size: 28px; font-weight: 800; color:#494032; background:#ffffff; border: 3px solid transparent; }
    .doc .hl b { position: absolute; inset: -3px; border-radius: 10px; border: 4px solid var(--accent); background:#c9aa7b22; transform-origin: left center; }
    .flag { position: absolute; left: 1080px; top: 760px; }
  </style>
</head>
<body>
  <div id="frame">
    <div class="badge"><span>향후 도입 가상 예시</span><span>내부 지식 보조</span></div>
    <div class="card chat" id="chat"><div class="top"><i></i>병원 업무 도우미</div>
      <div class="msgs">
        <p class="who" id="who1">상담 직원</p>
        <div class="q" id="q"></div>
        <div class="dots" id="dots"><i></i><i></i><i></i></div>
        <div class="a" id="a"></div>
        <span class="chip cite" id="cite">📄 출처: 공식 병원 정보 · 진료시간 항목</span>
      </div></div>
    <div class="paper doc" id="doc"><h3>공식 병원 정보</h3><p class="sub">병원이 확인한 정본 문서</p>
      <div class="l" style="width:70%"></div><div class="l" style="width:88%"></div>
      <div class="hl" id="hl"><b id="hlbox"></b>진료시간 · 평일 20시까지 · 토·일 진료</div>
      <div class="l" style="width:80%"></div><div class="l" style="width:62%"></div><div class="l" style="width:76%"></div></div>
    <span class="chip flag" id="flag">문서에 없는 내용은 “담당자 확인 필요”로 표시</span>
    <p class="caption" id="cap">직원이 물으면, 병원이 확인한 문서에서 찾아 출처와 함께 답합니다<small>가상 화면 · 실제 연동이 아닙니다</small></p>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script src="motion-kit.js"></script>
  <script>
  (async () => {
    const $ = (s) => document.querySelector(s);
    await motionKit.ready();
    const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
    tl.from("#chat", { y: 60, autoAlpha: 0, duration: .6 }, 0)
      .from("#cap", { autoAlpha: 0, duration: .5 }, .3)
      .from(["#who1", "#q"], { autoAlpha: 0, y: 20, duration: .35 }, .6);
    motionKit.typeText(tl, $("#q"), "주말에도 진료하나요? 손님께 어떻게 안내해요?", .8, 1.4);
    tl.from("#dots", { autoAlpha: 0, duration: .25 }, 2.4)
      .to("#dots i", { y: -10, duration: .25, stagger: .1, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.5)
      .from("#doc", { x: 80, autoAlpha: 0, duration: .55 }, 2.6)
      .from("#hlbox", { scaleX: 0, duration: .6, ease: "power2.inOut" }, 3.2)
      .to("#dots", { autoAlpha: 0, height: 0, padding: 0, duration: .2 }, 3.6)
      .from("#a", { autoAlpha: 0, y: 20, duration: .35 }, 3.7);
    motionKit.typeText(tl, $("#a"), "평일은 20시까지, 토·일요일도 진료합니다. 세부 시간은 공식 병원 정보를 확인해 안내해 주세요.", 3.8, 2.4);
    tl.from("#cite", { scale: .6, autoAlpha: 0, duration: .4, ease: "back.out(2)" }, 6.4)
      .from("#flag", { x: 40, autoAlpha: 0, duration: .45 }, 7.2);
    motionKit.start(tl, 10);
  })();
  </script>
</body>
</html>
