<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>interpret · 시연 영상 소스</title>
  <!-- 3부 동시 통역 시연 (15초). 외국인 환자 ↔ 원장님 실시간 통역 자막. 가상 대화이며 실제 환자 정보가 아니다. -->
  <link rel="stylesheet" href="base.css" />
  <style>
    #frame { font-family: "Pretendard", "WenQuanYi Zen Hei", "IPAGothic", sans-serif; }
    #wv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .person { position: absolute; top: 200px; width: 420px; text-align: center; }
    .person.l { left: 90px; } .person.r { right: 90px; }
    .ring { position: relative; width: 230px; height: 230px; margin: 0 auto; }
    .ring .ava { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: #2a2042; border: 4px solid #8562a9; }
    .ring .ava svg { width: 120px; height: 120px; }
    .ring .pul { position: absolute; inset: -6px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }
    .person h3 { margin-top: 22px; font-size: 34px; font-weight: 800; }
    .lang { display: inline-block; margin-top: 12px; padding: 8px 22px; border-radius: 30px; font-size: 26px; font-weight: 800; background: var(--pale); color: #352348; min-width: 150px; }
    .orb { position: absolute; left: 860px; top: 250px; width: 200px; height: 200px; border-radius: 50%; display: grid; place-items: center;
      background: radial-gradient(circle at 40% 35%, #e3c8ff, #8a4fe0 55%, #3a1d6b); box-shadow: 0 0 80px #b77affaa, inset 0 0 30px #fff4; font-size: 46px; font-weight: 800; color: #fff; }
    .orb small { position: absolute; bottom: -54px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #e9dcff; white-space: nowrap; font-weight: 700; letter-spacing: .1em; }
    .wave2 { position: absolute; left: 860px; top: 250px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid #d4b0ff; opacity: 0; }
    /* 자막 두 줄: 원문(작게) + 통역(크게) */
    .subs { position: absolute; left: 160px; right: 160px; top: 600px; height: 300px; }
    .sub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .sub .src { display: flex; align-items: center; gap: 14px; font-size: 32px; color: #cfc2e6; min-height: 48px; }
    .sub .src b { font-size: 20px; padding: 4px 12px; border-radius: 8px; background: #3a2c55; color: #e5d8fa; }
    .sub .dst { margin-top: 18px; padding: 22px 46px; border-radius: 22px; background: #000a; border: 2px solid #8562a9; font-size: 50px; font-weight: 800; line-height: 1.3; min-height: 108px; min-width: 300px; }
    .sub .dst b { display: block; font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: .2em; margin-bottom: 6px; }
    .chips { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; gap: 12px; }
    .chips span { padding: 8px 20px; border-radius: 24px; border: 2px solid #6d558d; background: #1d1932; font-size: 24px; font-weight: 700; color: #b8b3cf; }
    .live { position: absolute; right: 90px; top: 60px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 800; color: #ffb3c7; }
    .live i { width: 14px; height: 14px; border-radius: 50%; background: #ff6b8f; box-shadow: 0 0 14px #ff6b8f; }
  </style>
</head>
<body>
  <div id="frame">
    <div class="badge"><span>참고 예시</span><span>동시 통역</span></div>
    <div class="live" id="live"><i></i>LIVE · 실시간 통역</div>
    <svg id="wv" viewBox="0 0 1920 1080"><defs><linearGradient id="gw" x1="0" x2="1"><stop offset="0" stop-color="#b77aff" stop-opacity="0"/><stop offset=".5" stop-color="#e9d2ff"/><stop offset="1" stop-color="#b77aff" stop-opacity="0"/></linearGradient>
      <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g id="wl" filter="url(#gl)"></g><g id="wr" filter="url(#gl)"></g></svg>
    <div class="person l"><div class="ring"><div class="pul" id="pl"></div><div class="ava"><svg viewBox="0 0 24 24" fill="#d9c3f1"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-7 8.5-7s7.7 2.6 8.5 7z"/></svg></div></div>
      <h3>외국인 환자</h3><span class="lang" id="lang">English</span></div>
    <div class="person r"><div class="ring"><div class="pul" id="pr"></div><div class="ava"><svg viewBox="0 0 24 24" fill="#d9c3f1"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-7 8.5-7s7.7 2.6 8.5 7z"/><path d="M9 15l3 3 3-3" stroke="#2a2042" stroke-width="1.4" fill="none"/></svg></div></div>
      <h3>원장님</h3><span class="lang">한국어</span></div>
    <div class="wave2" id="w1"></div><div class="wave2" id="w2"></div>
    <div class="orb" id="orb">AI<small>동시 통역</small></div>
    <div class="chips" id="chips"><span>English</span><span>中文</span><span>日本語</span><span>Tiếng Việt</span><span>ภาษาไทย</span><span>Русский</span></div>
    <div class="subs">
      <div class="sub" id="u1"><p class="src"><b>EN</b><span id="u1s"></span></p><p class="dst"><b>한국어로</b><span id="u1d"></span></p></div>
      <div class="sub" id="u2"><p class="src"><b>KO</b><span id="u2s"></span></p><p class="dst"><b>ENGLISH</b><span id="u2d"></span></p></div>
      <div class="sub" id="u3"><p class="src"><b>中文</b><span>术后可以化妆吗？</span></p><p class="dst"><b>한국어로</b>시술 후 화장해도 되나요?</p></div>
      <div class="sub" id="u4"><p class="src"><b>日本語</b><span>予約の変更はできますか？</span></p><p class="dst"><b>한국어로</b>예약을 바꿀 수 있나요?</p></div>
    </div>
    <p class="caption" id="cap">외국인 환자와 원장님의 대화를 양쪽 언어 자막으로 실시간 통역합니다<small>가상 시연 · 실제 환자 정보 없음 · 진료 설명은 원장님이 확인</small></p>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script src="motion-kit.js"></script>
  <script>
  (async () => {
    const $ = (s) => document.querySelector(s);
    // 소리 물결: 말하는 사람 → AI 구슬, AI 구슬 → 듣는 사람. 시각으로 계산해 어느 시점이든 같은 화면
    const mk = (g, n) => { $(g).innerHTML = Array.from({ length: n }, (_, i) => `<path fill="none" stroke="url(#gw)" stroke-width="${4 - i}" stroke-linecap="round"/>`).join(""); return [...document.querySelectorAll(g + " path")]; };
    const WL = mk("#wl", 3), WR = mk("#wr", 3);
    const wavePath = (x0, x1, y, amp, ph) => { let d = ""; for (let x = x0; x <= x1; x += 8) { const k = (x - x0) / (x1 - x0), env = Math.sin(Math.PI * k); d += (d ? " L" : "M") + x + " " + (y + Math.sin(x * .03 + ph) * amp * env).toFixed(1); } return d; };
    await motionKit.ready();
    const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
    const st = { L: 0, R: 0 };   // 왼쪽(환자 쪽)·오른쪽(원장님 쪽) 물결 세기
    gsap.set(["#u2", "#u3", "#u4"], { autoAlpha: 0 });
    tl.from(".person.l", { x: -60, autoAlpha: 0, duration: .5 }, 0).from(".person.r", { x: 60, autoAlpha: 0, duration: .5 }, 0)
      .from("#orb", { scale: .3, autoAlpha: 0, duration: .6, ease: "back.out(2)" }, .3)
      .from(["#live", "#cap"], { autoAlpha: 0, duration: .5 }, .4)
      .from("#chips span", { y: 14, autoAlpha: 0, duration: .3, stagger: .06 }, .6);
    const speak = (pul, side, from, to) => { tl.to(pul, { opacity: 1, scale: 1.12, duration: .4, yoyo: true, repeat: 3, ease: "sine.inOut" }, from).to(st, { [side]: 1, duration: .3 }, from).to(st, { [side]: 0, duration: .4 }, to); };
    const ripple = (at) => { tl.fromTo("#w1", { scale: 1, opacity: .8 }, { scale: 1.8, opacity: 0, duration: 1 }, at).fromTo("#w2", { scale: 1, opacity: .8 }, { scale: 1.8, opacity: 0, duration: 1 }, at + .35); };
    // 1. 환자(영어) → 한국어
    speak("#pl", "L", 1.0, 3.0); ripple(2.0); tl.to(st, { R: .7, duration: .3 }, 2.3).to(st, { R: 0, duration: .4 }, 4.0);
    motionKit.typeText(tl, $("#u1s"), "I have a wedding in two weeks. Is there any downtime?", 1.0, 1.8);
    motionKit.typeText(tl, $("#u1d"), "2주 뒤에 결혼식이 있어요. 회복 기간이 있나요?", 2.2, 1.4);
    // 2. 원장님(한국어) → 영어
    tl.to("#u1", { autoAlpha: 0, y: -30, duration: .4 }, 4.5).to("#u2", { autoAlpha: 1, duration: .3 }, 4.7);
    speak("#pr", "R", 4.8, 6.8); ripple(5.8); tl.to(st, { L: .7, duration: .3 }, 6.1).to(st, { L: 0, duration: .4 }, 7.8);
    motionKit.typeText(tl, $("#u2s"), "붉은 기가 며칠 남을 수 있어서, 날짜에 맞춰 함께 정할게요.", 4.8, 1.7);
    motionKit.typeText(tl, $("#u2d"), "Some redness may last a few days, so let's plan around your date.", 6.0, 1.6);
    // 3. 다른 언어도 바로
    tl.to("#u2", { autoAlpha: 0, y: -30, duration: .4 }, 8.4)
      .to("#lang", { duration: .01, onStart: () => ($("#lang").textContent = "中文"), onReverseComplete: () => ($("#lang").textContent = "English") }, 8.6)
      .fromTo("#lang", { scale: .6 }, { scale: 1, duration: .35, ease: "back.out(2)", immediateRender: false }, 8.6)
      .to("#chips span:nth-child(2)", { backgroundColor: "#7540af", color: "#fff", borderColor: "#b77aff", duration: .2 }, 8.6)
      .fromTo("#u3", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: .45 }, 8.7);
    speak("#pl", "L", 8.7, 10.0); ripple(9.3);
    tl.to("#u3", { autoAlpha: 0, y: -30, duration: .4 }, 10.6)
      .to("#chips span:nth-child(2)", { backgroundColor: "#1d1932", color: "#b8b3cf", borderColor: "#6d558d", duration: .2 }, 10.8)
      .to("#lang", { duration: .01, onStart: () => ($("#lang").textContent = "日本語"), onReverseComplete: () => ($("#lang").textContent = "中文") }, 10.8)
      .fromTo("#lang", { scale: .6 }, { scale: 1, duration: .35, ease: "back.out(2)", immediateRender: false }, 10.8)
      .to("#chips span:nth-child(3)", { backgroundColor: "#7540af", color: "#fff", borderColor: "#b77aff", duration: .2 }, 10.8)
      .fromTo("#u4", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: .45 }, 10.9);
    speak("#pl", "L", 10.9, 12.2); ripple(11.5);
    const draw = (t) => {
      WL.forEach((p, i) => { p.setAttribute("d", wavePath(330, 860, 365, (20 + i * 14) * st.L, t * 9 + i * 1.3)); p.style.opacity = st.L ? 1 : 0; });
      WR.forEach((p, i) => { p.setAttribute("d", wavePath(1060, 1590, 365, (20 + i * 14) * st.R, -t * 9 + i * 1.3)); p.style.opacity = st.R ? 1 : 0; });
      $("#orb").style.boxShadow = `0 0 ${80 + 60 * Math.max(st.L, st.R) * (.5 + .5 * Math.sin(t * 10))}px #b77affcc, inset 0 0 30px #fff4`;
    };
    motionKit.start(tl, 15, draw);
  })();
  </script>
</body>
</html>
