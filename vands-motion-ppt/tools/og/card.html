<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:400;src:url(../../assets/fonts/Pretendard-Regular.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../assets/fonts/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../../assets/fonts/Pretendard-ExtraBold.woff2)}
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;font-family:P;word-break:keep-all;
 background:radial-gradient(ellipse at 85% 0%,#5a4728 0%,#1d1915 45%,#0c0b0a 85%);color:#f6f1e7;position:relative}
.frame{position:absolute;inset:26px;border:1.5px solid #c9a96a66;border-radius:18px}
.k{position:absolute;left:78px;top:92px;font-size:22px;font-weight:700;letter-spacing:.32em;color:#d9bd84}
h1{position:absolute;left:74px;top:140px;font-size:76px;font-weight:800;line-height:1.16;letter-spacing:-2.5px}
h1 em{font-style:normal;background:linear-gradient(90deg,#f3dca6,#c9a25a);-webkit-background-clip:text;color:transparent}
.s{position:absolute;left:78px;top:350px;font-size:27px;color:#d8cfbf;line-height:1.5}
.chips{position:absolute;left:78px;bottom:78px;display:flex;gap:12px}
.chips span{padding:10px 20px;border-radius:30px;border:1.5px solid #c9a96a88;font-size:22px;font-weight:700;color:#f0e2c4;background:#ffffff08}
.chips span:first-child{background:#e2c88e;color:#2a2116;border-color:#e2c88e}
.shot{position:absolute;right:-60px;top:120px;width:520px;height:330px;border-radius:14px;overflow:hidden;border:2px solid #c9a96a;box-shadow:0 30px 70px #000c;transform:rotate(-4deg)}
.shot i{display:block;height:24px;background:#1f1b16;border-bottom:1px solid #3a3226}
.shot img{width:100%;height:306px;object-fit:cover;object-position:left top}
.fade{position:absolute;right:0;top:0;bottom:0;width:180px;background:linear-gradient(90deg,#0c0b0a00,#0c0b0a99)}
</style></head><body><div class="frame"></div>
<div class="shot"><i></i><img src="../../assets/new-homepage-hero.png"></div><div class="fade"></div>
<p class="k">PROPOSAL · AI 검색 GEO</p>
<h1>밴스의원 부산점<br><em>제안서</em></h1>
<p class="s">AI가 병원을 추천하는 시대,<br>정확한 정보로 먼저 답하도록</p>
<div class="chips"><span>1부 진단</span><span>2부 새 홈페이지</span><span>3부 참고 예시</span></div>
</body></html>
