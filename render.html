<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>render</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #0a0b0b; }
  </style>
</head>
<body>
  <script src="slides.js"></script>
  <script>
    // ?c=<캐러셀 index>&i=<슬라이드 index> 한 장을 실제 크기(1080×1350)로 렌더
    const p = new URLSearchParams(location.search);
    const c = Math.max(0, Math.min(window.CAROUSELS.length - 1, parseInt(p.get("c") || "0", 10)));
    const slides = window.CAROUSELS[c].slides;
    const i = Math.max(0, Math.min(slides.length - 1, parseInt(p.get("i") || "0", 10)));
    document.body.appendChild(window.buildCard(slides[i], i, slides.length));
    document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
  </script>
</body>
</html>
