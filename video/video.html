<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영상 미리보기</title>
  <link rel="stylesheet" href="video.css" />
  <style>
    /* ---- 미리보기 플레이어 UI (렌더 모드에서는 숨김) ---- */
    body { background: #1c1916; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           font-family: "Pretendard", sans-serif; color: #e9e3d6; }
    .frame { margin-top: 20px; width: calc(1080px * var(--s, .5)); height: calc(1350px * var(--s, .5));
             border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .frame .stage { transform: scale(var(--s, .5)); transform-origin: top left; }
    .ctrl { display: flex; align-items: center; gap: 14px; margin: 16px 0 24px; width: calc(1080px * var(--s, .5)); }
    .ctrl button { border: 0; background: #C0592F; color: #fff; border-radius: 999px; width: 46px; height: 46px;
                   font-size: 18px; cursor: pointer; flex: 0 0 auto; }
    .ctrl input { flex: 1; accent-color: #C0592F; }
    .ctrl span { font-variant-numeric: tabular-nums; font-size: 13px; color: #a89e90; width: 90px; text-align: right; }
    body.render { background: none; display: block; min-height: 0; }
    body.render .frame { margin: 0; width: 1080px; height: 1350px; border-radius: 0; box-shadow: none; }
    body.render .frame .stage { transform: none; }
    body.render .ctrl { display: none; }
  </style>
</head>
<body>
  <div class="frame"><div class="stage" id="stage"></div></div>
  <div class="ctrl">
    <button id="play" aria-label="재생">▶</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" />
    <span id="time">0.0s</span>
  </div>

  <script src="engine.js"></script>
  <script src="scenes.js"></script>
  <script>
    // ?ep=<에피소드 폴더명>  ?render=1 → 렌더 전용(컨트롤 숨김, 자동재생 없음)
    const p = new URLSearchParams(location.search);
    const ep = p.get("ep") || "ep01-receipt";
    const render = p.get("render") === "1";
    if (render) document.body.classList.add("render");

    const s = document.createElement("script");
    s.src = `episodes/${ep}/episode.js`;
    s.onload = () => {
      window.buildVideo(document.getElementById("stage"), window.EPISODE);
      window.seek(0);
      document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
      if (!render) player();
    };
    document.head.appendChild(s);

    function player() {
      const D = window.TL.duration;
      const scrub = document.getElementById("scrub"), time = document.getElementById("time"),
            btn = document.getElementById("play");
      let t = 0, playing = false, last = 0;
      const fit = () => {
        const sc = Math.max(.25, Math.min(.7, (innerHeight - 120) / 1350, (innerWidth - 32) / 1080));
        document.documentElement.style.setProperty("--s", sc.toFixed(4));
      };
      const draw = () => { window.seek(t); scrub.value = (t / D) * 1000; time.textContent = `${t.toFixed(1)} / ${D.toFixed(1)}s`; };
      const loop = (now) => {
        if (!playing) return;
        t += (now - last) / 1000; last = now;
        if (t >= D) { t = D; playing = false; btn.textContent = "↺"; }
        draw();
        if (playing) requestAnimationFrame(loop);
      };
      btn.onclick = () => {
        if (t >= D) t = 0;
        playing = !playing; btn.textContent = playing ? "❚❚" : "▶";
        if (playing) { last = performance.now(); requestAnimationFrame(loop); }
      };
      scrub.oninput = () => { t = (scrub.value / 1000) * D; draw(); };
      document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); btn.click(); } });
      addEventListener("resize", fit);
      fit(); draw();
    }
  </script>
</body>
</html>
